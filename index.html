<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pardesi Consultancy – Home</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root{
      --burgundy: #2b0504;
      --gold: #b08d2f;
      --glow: rgba(176,141,47,0.85);
    }

    body{
      font-family: "Poppins", system-ui, sans-serif;
      background: var(--burgundy);
      color: var(--gold);
      text-shadow: 0 0 10px var(--glow);
    }

    a, p, h1, h2, h3, h4, h5, h6, span, li, div, button {
      color: var(--gold);
      text-shadow: 0 0 10px var(--glow);
    }

    /* GOLD GLITTER – BODY COMPANY NAME ONLY */
    .gold-glitter {
      background: linear-gradient(
        120deg,
        var(--gold) 40%,
        #ffe7a3 50%,
        var(--gold) 60%
      );
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: glitter 4s linear infinite;
      text-shadow: 0 0 20px var(--glow);
    }

    @keyframes glitter {
      0% { background-position: 200% center; }
      100% { background-position: 0% center; }
    }

    /* LOGO FIX FOR iOS SAFARI */
    .brand-logo {
      display: block;
      background: transparent;
      mix-blend-mode: lighten;
    }

    @supports (-webkit-touch-callout: none) {
      .brand-logo {
        mix-blend-mode: normal !important;
      }
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<header class="fixed top-0 left-0 right-0 z-50 bg-[var(--burgundy)] border-b border-[var(--gold)]/40 shadow-lg">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">

    <!-- LOGO + NAME -->
    <a href="index.html" class="flex items-center gap-4">
      <img
        src="/images/logo.png"
        alt="Pardesi Consultancy Logo"
        class="brand-logo w-16 h-16 object-contain opacity-95
               drop-shadow-[0_0_20px_rgba(176,141,47,1)]"
      />
      <div class="leading-tight uppercase">
        <div class="text-base">PARDESI CONSULTANCY</div>
        <div class="text-xs tracking-[0.18em] opacity-90">
          Where Growth Meets Success
        </div>
      </div>
    </a>

    <!-- DESKTOP MENU -->
    <nav class="hidden md:flex items-center gap-6 text-sm uppercase">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="contact.html">Contact</a>
    </nav>

    <!-- MOBILE MENU BUTTON -->
    <button
      class="md:hidden text-2xl"
      onclick="document.getElementById('mobileMenu').classList.toggle('hidden');"
    >☰</button>
  </div>

  <!-- MOBILE MENU -->
  <div id="mobileMenu" class="md:hidden hidden border-t border-[var(--gold)]/30 uppercase">
    <a href="index.html" class="block px-4 py-3 border-b border-[var(--gold)]/20">Home</a>
    <a href="about.html" class="block px-4 py-3 border-b border-[var(--gold)]/20">About</a>
    <a href="services.html" class="block px-4 py-3 border-b border-[var(--gold)]/20">Services</a>
    <a href="contact.html" class="block px-4 py-3">Contact</a>
  </div>
</header>

<div class="pt-32"></div>

<!-- HERO -->
<section class="h-[88vh] w-full flex items-center justify-center text-center px-6">
  <div class="flex flex-col items-center">

    <!-- HERO LOGO -->
    <div class="w-44 h-44 flex items-center justify-center">
      <img
        src="/images/logo.png"
        alt="Pardesi Consultancy Logo"
        class="brand-logo w-40 h-40 object-contain opacity-95
               drop-shadow-[0_0_44px_rgba(176,141,47,1)]"
      />
    </div>

    <!-- COMPANY NAME -->
    <h1 class="mt-6 text-4xl md:text-5xl uppercase font-normal gold-glitter">
      PARDESI CONSULTANCY
    </h1>

    <p class="mt-3 text-sm tracking-[0.25em] uppercase opacity-90">
      Where Growth Meets Success
    </p>

 

    </div>

  </div>
</section>

<!-- FOOTER -->
<footer class="border-t border-[var(--gold)]/30 py-5 text-xs uppercase">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 flex justify-between">
    <div>© 2025 PARDESI CONSULTANCY</div>
    <div>Where Growth Meets Success</div>
  </div>
</footer>

</body>
</html>
