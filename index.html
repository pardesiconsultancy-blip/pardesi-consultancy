<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pardesi Consultancy – Home</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root{
      --burgundy: #2b0504;
      --gold: #b08d2f; /* MUST match logo gold */
    }

    body{
      font-family: "Poppins", system-ui, sans-serif;
      background: var(--burgundy);
      color: var(--gold);
      text-shadow: 0 0 10px rgba(176,141,47,0.55);
    }

    a, p, h1, h2, h3, h4, h5, h6, span, li, div, button {
      color: var(--gold);
      text-shadow: 0 0 10px rgba(176,141,47,0.55);
    }

    /* ===== GOLD GLITTER EFFECT (BODY COMPANY NAME ONLY) ===== */
    .gold-glitter {
      position: relative;
      display: inline-block;
      background: linear-gradient(
        120deg,
        var(--gold) 40%,
        #fff2b0 50%,
        var(--gold) 60%
      );
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: glitter 4s linear infinite;
      text-shadow: 0 0 18px rgba(176,141,47,0.75);
    }

    @keyframes glitter {
      0% { background-position: 200% center; }
      100% { background-position: 0% center; }
    }
    /* ======================================================= */

    /* Force Tailwind overrides */
    .text-white, .text-black, .text-gray-100, .text-gray-200, .text-gray-300 {
      color: var(--gold) !important;
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<header class="fixed top-0 left-0 right-0 bg-[var(--burgundy)] border-b border-[var(--gold)]/40 shadow-lg z-50">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">

    <!-- LOGO + NAME -->
    <a href="index.html" class="flex items-center gap-3">
      <img
        src="/images/logo.png"
        alt="Pardesi Consultancy Logo"
        class="w-14 h-14 object-contain opacity-95
               drop-shadow-[0_0_16px_rgba(176,141,47,0.7)]
               mix-blend-lighten"
      />
      <div class="leading-tight">
        <div class="text-base uppercase">PARDESI CONSULTANCY</div>
        <div class="text-xs tracking-[0.18em] uppercase opacity-90">
          Where Growth Meets Success
        </div>
      </div>
    </a>

    <nav class="hidden md:flex items-center gap-6 text-sm uppercase">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="contact.html">Contact</a>
    </nav>

    <button
      class="md:hidden text-2xl"
      onclick="document.getElementById('mobileMenu').classList.toggle('hidden');"
    >☰</button>
  </div>
</header>

<div class="pt-28"></div>

<!-- HERO -->
<section class="h-[88vh] w-full flex items-center justify-center text-center px-6">
  <div class="flex flex-col items-center">

    <!-- BIG LOGO -->
    <div class="w-40 h-40 flex items-center justify-center">
      <img
        src="/images/logo.png"
        alt="Pardesi Consultancy Logo"
        class="w-36 h-36 object-contain opacity-95
               drop-shadow-[0_0_34px_rgba(176,141,47,0.8)]
               mix-blend-lighten"
      />
    </div>

    <!-- COMPANY NAME WITH GOLD GLITTER -->
    <h1 class="mt-6 text-4xl md:text-5xl font-normal uppercase gold-glitter">
      PARDESI CONSULTANCY
    </h1>

    <p class="mt-3 text-sm tracking-[0.25em] uppercase opacity-90">
      Where Growth Meets Success
    </p>

    <!-- ICON ONLY CONTACT -->
    <div class="mt-10 flex gap-4 justify-center">
      <a href="https://wa.me/19052266327"
         class="w-14 h-14 rounded-full flex items-center justify-center
                border border-[var(--gold)] hover:opacity-85">
        📱
      </a>

      <a href="tel:+19052266327"
         class="w-14 h-14 rounded-full flex items-center justify-center
                border border-[var(--gold)] hover:opacity-85">
        📞
      </a>
    </div>

  </div>
</section>

<!-- FOOTER -->
<footer class="border-t border-[var(--gold)]/30 py-5 text-xs uppercase">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 flex justify-between">
    <div>© 2025 PARDESI CONSULTANCY</div>
    <div>Where Growth Meets Success</div>
  </div>
</footer>

</body>
</html>
